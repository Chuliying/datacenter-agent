name: Runtime

on:
  pull_request:
  push:
    branches:
      - main
      - runtime-test

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Pipeline eval
        run: cargo run --bin eval -- --pipeline-only

      - name: Response replay smoke
        run: cargo run --bin eval -- --response --replay config/runtime/evals/replay-smoke.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不 init submodule：gate 對 .gitmodules 宣告的路徑整段跳過（存在性與版控檢查都不做），
      # 只驗外層 repo 的連結——submodule 內容由 gitlink 釘住，不是本 gate 的職責
      - name: Doc link gate
        run: bash scripts/check-doc-links.sh
