# =====================================================================
# datacenter-agent top-level application config
# ---------------------------------------------------------------------
# This file is the single entry point read at startup.
#
# Every other config file referenced below is resolved RELATIVE TO THIS
# FILE'S PARENT DIRECTORY, so the whole `config/` folder is a
# self-contained, container-mountable unit.
#
# For example, you can mount `config/` then use `--config /.../config.toml`.
#
# Absolute paths are accepted too, which is handy for ad-hoc overrides.
# =====================================================================

version = 1


# ──── Prompt guide section ───
# Each entry binds a stable prompt id (used in code) to a Markdown file
# that holds the actual prose. Markdown is loaded and sent to the model.
#
# Adding a new id here does not immediately wire it into any call path,
# call sites look prompts up by id. Removing or renaming an id will break
# the call site that depends on it.
#
# Currently implemented, good for reference:
#   * agent_system              — legacy monolith analytics prompt (eval baseline).
#   * greeting_fetcher_system   — greeting pipeline: the data-fetch stage.
#   * greeting_analyst_system   — greeting pipeline: the C-suite greeting writer (terminal).
#   * greeting_user             — greeting pipeline: the boot-time request prompt.
#   * fetcher_system            — insight/report pipelines: the shared data-fetch stage.
#   * analyst_system            — /insight pipeline: the markdown-report analyst.
#   * charter_system            — /insight pipeline: the chart selector (0–2 charts).
#   * report_analyst_system     — /report pipeline: the insight-narrative analyst.
#   * report_composer_system    — /report pipeline: the emit_report composer.
#   * ss_fetcher_system         — /ss-chat pipeline: the 星星電力 data-fetch stage.
#   * ss_analyst_system         — /ss-chat pipeline: the 星星電力 management analyst.
#   * ss_charter_system         — /ss-chat pipeline: the 星星電力 chart selector (0–2 charts).
#
# All prompts are loaded dynamically at boot, so retuning a stage prompt is a config edit
# (no recompile) — edit the Markdown file, or point an id at a different file below.

[prompts.agent_system]
file = "prompt_guide/agent_system.md"

[prompts.greeting_fetcher_system]
file = "prompt_guide/greeting_fetcher_system.md"

[prompts.greeting_analyst_system]
file = "prompt_guide/greeting_analyst_system.md"

[prompts.greeting_user]
file = "prompt_guide/greeting_user.md"

# ── /insight + /report pipeline stage prompts ──
[prompts.fetcher_system]
file = "prompt_guide/fetcher_system.md"

[prompts.analyst_system]
file = "prompt_guide/analyst_system.md"

[prompts.charter_system]
file = "prompt_guide/charter_system.md"

[prompts.report_analyst_system]
file = "prompt_guide/report_analyst_system.md"

[prompts.report_composer_system]
file = "prompt_guide/report_composer_system.md"

# ── /ss-chat pipeline stage prompts (星星電力 investor platform) ──
[prompts.ss_fetcher_system]
file = "prompt_guide/ss_fetcher_system.md"

[prompts.ss_analyst_system]
file = "prompt_guide/ss_analyst_system.md"

[prompts.ss_charter_system]
file = "prompt_guide/ss_charter_system.md"


# ──── Insight pipeline tool grants ───
# Which tools each /insight sub-agent exposes to its LLM, by wire name.
# Edit these to change grants WITHOUT recompiling.
#
#   * MCP tool names are resolved against the datacenter server's advertised set
#     at boot — a typo (or a tool the server does not offer) fails boot loudly.
#   * "emit_chart" is a built-in, code-backed sink (not an MCP tool).
#   * "*" is a shorthand for "every tool the MCP server advertises", handy while
#     iterating; the explicit list below is the auditable production form.
#
# Omitting this whole section defaults `fetcher` to ["*"] and `charter` to
# ["emit_chart"].

[insight.grants]
# The datacenter analytics tools the insight fetcher may call. The report fetcher
# has its own six-tool ceiling below; see that section for the intentional difference.
fetcher = [
    "bill_revenue",
    "bill_charge",
    "member_analysis",
    "business_metrics",
    "station_revenue_ranking",
]
charter = ["emit_chart"]


# ──── SS chat pipeline tool grants ───
# `/ss-chat/stream` runs the same four-stage chat pipeline as `/agent/stream`'s insight
# pipeline (fetcher → analyst → charter → finalizer), but over the 星星電力 investor-platform
# tools instead of the EV-charging ones, and with its own stage prompts (`ss_*_system`).
#
# The grant is deliberately an EXPLICIT list, not `"*"`: the MCP server advertises both the
# EV-charging tools and the `ss_*` ones, so a wildcard here would hand the SS fetcher the
# datacenter tools its prompt says nothing about. Names resolve exactly as `[insight.grants]`
# does (boot-validated against the server's advertised set; `emit_chart` is the built-in sink).
#
# Omitting this whole section defaults `fetcher` to the six `ss_*` tools below and `charter`
# to ["emit_chart"].

[ss_chat.grants]
fetcher = [
    "ss_sunshine_hours",
    "ss_energy_storage",
    "ss_power_wheeling",
    "ss_power_pipeline",
    "ss_btm_projects",
    "ss_ftm_projects",
]
charter = ["emit_chart"]


# ──── Report pipeline assets ───
# The /report pipeline (fetcher → analyst → composer → renderer) renders a self-contained HTML
# report by injecting the composer's structured data into this template — the LLM never writes
# HTML. The template must contain the `__REPORT_DATA_JSON__` placeholder (checked at boot); its
# design tokens (brand palette) are baked into the template's `:root` CSS block, so retuning the
# brand is a template edit. Omitting this section defaults to `report_template/report.html`.
#
# The /report fetcher reuses the `[insight.grants].fetcher` tools above (the same broad snapshot).

[report]
template = "report_template/report.html"

# The report pipeline's own tool ceiling, separate from `[insight.grants].fetcher` on
# purpose. Reports may use the full six-tool snapshot without widening insight's
# five-tool grant.
#
# It is a ceiling, not a guarantee: per-request narrowing intersects it with the caller's
# permissions, and a report with only some topics permitted degrades rather than refusing.
[report.grants]
fetcher = [
    "bill_revenue",
    "station_revenue_ranking",
    "bill_charge",
    "business_metrics",
    "member_analysis",
    "bill_member_analysis",
]


# ──── Authorization mapping ───
# The gate is `boot grant ∩ permission grant ∩ intent required tools`, with anything
# either table fails to cover denied. Intersecting all three is the point: a finance-only
# user asking a member question still holds a non-empty narrowed set (their finance
# tools), so a "narrowed set is non-empty" rule would wave them through.
#
# CONFIRM-FU-001: every row below was derived from `config/runtime/intents.toml` and the
# frontend's permission codes, not from an authoritative mapping document. Each row needs
# an explicit sign-off from the domain owner during PR review. The two rows most open to
# argument are marked CONFIRM? — `business_metrics` (operations or finance?) and
# `station_revenue_ranking` (finance or operations?).

[authz]
# Falcon permission codes any one of which unlocks the SS chat pipeline (/ss-chat/stream).
# CONFIRM-FU-001: the four startrade-power sub-pages are listed on the same reasoning as the
# starcharger rows above — the SS tools serve 星星電力 data, and Falcon's permission tree has
# exactly these sub-pages for that business unit. Whether all four should unlock the full SS
# tool set (rather than a finer per-sub-page split) needs the domain owner's sign-off at PR
# review. The parent page alone deliberately unlocks nothing (AC-008's rule).
ss_chat_permissions = [
    "hdrenewables/elecsvc/startrade-power/finance",
    "hdrenewables/elecsvc/startrade-power/opperf",
    "hdrenewables/elecsvc/startrade-power/engproj",
    "hdrenewables/elecsvc/startrade-power/bizdev",
]

# Falcon permission code -> the MCP data tools it unlocks.
[authz.permission_tools]
# 財務
"hdrenewables/elecsvc/starcharger/finance" = ["bill_revenue", "station_revenue_ranking"]  # CONFIRM? station_revenue_ranking
# 營運績效
"hdrenewables/elecsvc/starcharger/opperf" = ["bill_charge", "business_metrics"]           # CONFIRM? business_metrics
# 業務發展
"hdrenewables/elecsvc/starcharger/bizdev" = ["member_analysis", "bill_member_analysis"]
# 工程專案 — no MCP endpoint serves engineering-project data yet, so this permission
# unlocks nothing. Deliberately present rather than omitted: an absent row and an
# empty row must not be confused.
"hdrenewables/elecsvc/starcharger/engproj" = []

# Runtime intent -> the tools that intent requires. Must cover the whole
# `intent_allowlist` in config/runtime/intents.toml; an uncovered intent fails startup.
[authz.intent_tools]
# Low confidence or unrecognised: no tools, so it always lands on the refusal branch,
# matching the existing "don't answer when unsure" behavior.
unknown = []
revenue = ["bill_revenue", "station_revenue_ranking"]
charging = ["bill_charge", "business_metrics"]
member = ["member_analysis", "bill_member_analysis"]
# No engineering-project endpoint yet, so this intent always refuses (FU-003).
site-build = []
# A full report spans every topic. Its gate is the one exception to the strict rule:
# a non-empty intersection is enough, and the report degrades to the permitted topics
# rather than refusing outright.
report = [
    "bill_revenue",
    "station_revenue_ranking",
    "bill_charge",
    "business_metrics",
    "member_analysis",
    "bill_member_analysis",
]


# ──── Falcon identity ───
# Where the runtime verifies the end user's Falcon access token, forwarded by the BFF in
# `X-Falcon-Authorization` (S-RUNTIME-SEC-02 FR-001). The runtime only ever appends
# `/api/auth/me/permissions` to `base_url`; it holds no external client API key and never
# calls `/external-login` or `/external-refresh`.
#
# There is deliberately NO `enabled` switch: the identity layer is unconditional in this
# binary. Rollout compatibility comes from the *previous* binary ignoring the unknown
# header, not from a flag here — a flag would let a default-config deploy silently ship
# with RBAC off.
#
# positive_ttl_ms doubles as the upper bound on how long a Falcon-side permission
# revocation takes to take effect. negative_ttl_ms bounds the amplification from a
# consumer stuck resending one dead token; it must not exceed positive_ttl_ms.
[identity]
base_url = "https://dev.hdre-eomc.com"
positive_ttl_ms = 60000     # successful lookup reuse window
negative_ttl_ms = 10000     # failed lookup replay window
request_timeout_ms = 5000   # per-request timeout for the permissions call


# ──── Server ingress policy ───
# Opt-in process-local global burst limiter for the expensive routes
# (/agent/stream, /v1/chat/completions). Applied after each route family's
# bearer gate; /health, /ready and /greeting are never limited. When the
# bucket is exhausted the request is rejected with 429 + Retry-After before
# JSON extraction and before any LLM/MCP/SQLite business operation.
#
# Disabled by default. When the section is present, the policy must be
# explicit — there is no undocumented preset. State is process-local and
# resets on restart: this is short-window admission control, not a durable
# quota (see docs/work/runtime-user-session-rate-limit/runbook.md).
#
# Two layers, and their positions are not interchangeable. The outer global bucket stays
# where it is — after the service bearer gate, BEFORE identity resolution — because it is
# the only thing bounding traffic whose identity never resolves (a caller cycling distinct
# invalid tokens finishes at the identity layer and never reaches the inner bucket). The
# inner per-actor bucket necessarily sits after identity resolution, since it needs the
# `actor_key`.
#
# Enabling the outer layer is a prerequisite, not a preference: with the identity layer
# present, startup fails if it is disabled (ERR-009), for the same reason a missing pepper
# fails startup. The inner layer has no `enabled` switch at all — an opt-out would be a
# bypass of the fail-closed decision.
[server.rate_limit]
enabled = true
burst_size = 20          # whole-service admissions available at once
refill_period_ms = 250   # one admission refills every 250ms

[server.rate_limit.per_actor]
burst_size = 5             # per-user admissions available at once
refill_period_ms = 1000    # one admission refills every second, per user
max_tracked_actors = 4096  # bucket cardinality bound; least-recently-used is evicted


# ──── Runtime capability pack section ───
# These refs are parsed and wired into AppState at boot. The runtime route is
# unconditional in the shipped configuration; identity-protected prompt routes
# fail closed if the runtime cannot be assembled.

[runtime]
intents = "runtime/intents.toml"
lexicon = "runtime/lexicon.toml"
thresholds = "runtime/thresholds.toml"
injection = "runtime/injection.toml"

[runtime.input]
input_stages = ["normalize", "input_guard", "injection", "intent", "slots"]

[runtime.answer_policy]
backend = "rule"

[runtime.llm_normalizer]
enabled = false
backend = "disabled"

[runtime.memory]
enabled = true
backend = "in-memory"

[runtime.audit]
# Audit records are emitted as structured `tracing` events (audit.* / INFO,
# key=value fields) — stderr via the tracing stack, not a stdout JSON stream.
sink = "tracing"
failure_policy = "fail-open"

[runtime.guardrails]
enabled = ["injection", "input_guard", "answer_policy"]

[runtime.slots]
extractors = ["time_range", "metric", "asset", "rank_limit"]

[runtime.eval]
pipeline_evaluators = ["pipeline-deterministic"]
response_evaluators = ["response-baseline", "llm-judge"]
fixtures = "runtime/evals/inputs.json"
baseline = "runtime/evals/response-baseline.json"
