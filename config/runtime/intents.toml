# EV Chief-of-Staff runtime intent pack.

intent_allowlist = [
  "unknown",
  "revenue",
  "charging",
  "site-build",
  "member",
  "report",
]

[option_prefixes]
revenue = "revenue"
charging = "charging"
site = "site-build"
member = "member"
report = "report"

[[intents]]
id = "unknown"
keywords = ["未知", "其他"]

[[intents]]
id = "revenue"
keywords = ["營收", "收入", "賺多少", "客單價", "帳單", "單價", "折扣", "折扣率", "revenue"]

[[intents]]
id = "charging"
keywords = ["充電", "度數", "電量", "充電次數", "充電時數", "使用率", "charging"]

[[intents]]
id = "site-build"
keywords = ["建置", "站點", "場站", "site"]

# Membership base — identified by membership-specific vocabulary. Generic
# growth words (e.g. 成長) are deliberately excluded so revenue-growth phrasing
# like `營收成長` stays on `revenue` instead of colliding here.
[[intents]]
id = "member"
keywords = ["會員", "會員數", "會員成長", "註冊", "留存", "活躍會員", "用戶", "充電用戶", "新用戶", "membership", "member"]

# Full HTML report — a routing intent, orthogonal to the topic above. When the
# user asks for a "報告" the `/agent/stream` front door runs the `/report`
# pipeline (fetcher → analyst → composer → renderer) instead of `/insight`; the
# topic (營收 / 充電 / …) still rides along in the prompt. Routing keys off this
# intent being *mentioned* (top or candidate), so `營收報告` reports on revenue.
[[intents]]
id = "report"
keywords = ["報告", "完整的報告", "完整報告", "report"]
